name: TripMates CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: test
      ALLOW_MEMORY_FALLBACK: 'true'
      DATABASE_URL: mysql://tripmates:tripmates@127.0.0.1:3306/tripmates_test
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tripmates_test
          MYSQL_USER: tripmates
          MYSQL_PASSWORD: tripmates
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -utripmates -ptripmates"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - name: Run unit tests
        run: pnpm test
        timeout-minutes: 10
        env:
          DATABASE_URL: ''
          ALLOW_MEMORY_FALLBACK: 'true'
      - name: Apply database migrations
        run: pnpm db:push
        timeout-minutes: 5
      - name: Seed database
        run: pnpm db:seed
        timeout-minutes: 5
      - name: Verify migration ledger is stable on second run
        run: |
          before=$(mysql --protocol=tcp -h 127.0.0.1 -utripmates -ptripmates tripmates_test -Nse 'SELECT COUNT(*) FROM schema_migrations')
          output=$(pnpm db:push)
          after=$(mysql --protocol=tcp -h 127.0.0.1 -utripmates -ptripmates tripmates_test -Nse 'SELECT COUNT(*) FROM schema_migrations')
          test "$before" = "$after"
          ! printf '%s' "$output" | grep -q 'Applied '
        timeout-minutes: 5
      - name: Run MySQL integration tests
        run: |
          set +e
          timeout --foreground --signal=TERM --kill-after=30s 10m pnpm test:mysql
          status=$?
          if [ "$status" -eq 124 ]; then
            echo "::error::MySQL integration tests exceeded the 10-minute limit; inspect database queries and test cleanup."
          fi
          exit "$status"
        timeout-minutes: 11
      - name: Verify restart persistence
        run: pnpm test:restart
        timeout-minutes: 5
      - name: TypeScript check
        run: pnpm check
        timeout-minutes: 10
      - name: Production build
        run: pnpm build
        timeout-minutes: 10
      - name: Install Playwright browser dependencies
        run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 15
      - name: Run browser acceptance tests
        run: pnpm test:e2e
        timeout-minutes: 15
        env:
          ALLOW_MEMORY_FALLBACK: 'false'
