name: TripMates CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: tripmates-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      ALLOW_MEMORY_FALLBACK: 'true'
      DATABASE_URL: mysql://tripmates:tripmates@127.0.0.1:3306/tripmates_test
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tripmates_test
          MYSQL_USER: tripmates
          MYSQL_PASSWORD: tripmates
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -utripmates -ptripmates"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          DATABASE_URL: ''
          ALLOW_MEMORY_FALLBACK: 'true'
      - run: pnpm db:push
      - run: pnpm db:seed
      - name: Verify migration ledger is stable on second run
        run: |
          before=$(mysql --protocol=tcp -h 127.0.0.1 -utripmates -ptripmates tripmates_test -Nse 'SELECT COUNT(*) FROM schema_migrations')
          output=$(pnpm db:push)
          after=$(mysql --protocol=tcp -h 127.0.0.1 -utripmates -ptripmates tripmates_test -Nse 'SELECT COUNT(*) FROM schema_migrations')
          test "$before" = "$after"
          ! printf '%s' "$output" | grep -q 'Applied '
      - name: Run MySQL integration tests without repeating migration setup
        run: node --import tsx --test test/mysql.integration.test.ts
      - run: pnpm test:restart
      - run: pnpm check
      - run: pnpm build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium when not cached
        run: pnpm exec playwright install chromium
      - name: Run browser acceptance tests
        run: pnpm test:e2e
        env:
          ALLOW_MEMORY_FALLBACK: 'false'
